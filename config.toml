[arxiv]
enabled = true
categories = ["cs.LG", "cs.CV", "cs.CL", "cs.AI", "cs.RO", "stat.ML"]
# Most viewed (alphaXiv views; arXiv publishes none): top_n per window + a core message per paper.
windows = [3, 7, 30]            # days; shown freshest first
top_n = 5
max_pages = 4                   # alphaXiv pages (×50) to scan per window until top_n ML papers are found
message_model = "opus"
timeout_sec = 900
# Trend summary over ALL abstracts of the daily mailing. OFF by default: ~1M tokens & ~7 min per run
# (measured 2026-09-28, 548 papers). Set true to re-enable.
trend_enabled = false
chunk_size = 120
parallel = 10
map_model = "opus"
reduce_model = "opus"
max_trends = 8
abstract_chars = 2000
