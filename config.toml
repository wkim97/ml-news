# ml-news configuration (shared, committed). Secrets live in .env, never here.

[profile]
# Who the digest is for. The curator uses this to decide what is "hot" and what it means.
description = """
PhD researcher in AI/ML, with focus on computer vision and NLP.
Wants: frontier model releases (closed & open weights), major new architectures / training methods,
influential papers (esp. CV, multimodal, LLM, generative models), important open-source tools/datasets,
and big industry moves that change the research landscape.
Does NOT want: funding rounds, product marketing fluff, opinion pieces, tutorials, AI-policy chatter
(unless it materially affects research), minor version bumps, quantized re-uploads, crypto/AI hype.
"""
language = "Korean"          # language of the digest text (titles/links stay original)

[digest]
lookback_hours = 36          # candidate window when there is no previous successful run
max_items = 10               # hard cap on main items (radar excluded)
max_radar = 6                # one-liners for "worth a glance"
subject_prefix = "[ML News]"

[curate]
model = ""                   # empty = claude CLI default; e.g. "claude-opus-5-5"
timeout_sec = 1200
allow_web = true             # let the curator WebSearch/WebFetch to verify & catch missed big news

