[hackernews]
enabled = true
min_points = 100

[hf_models]
enabled = true
limit = 40
max_age_days = 14
# skip re-uploads / quantizations
exclude_regex = "(?i)gguf|awq|gptq|mlx|exl2|fp8|int4|int8|bnb|quant|uncensored|abliterated|lora"

[hf_models_robotics]
# Robotics models never reach the global HF trending list (LLMs dominate) → query the robotics task tag directly.
enabled = true
pipeline_tag = "robotics"
label = "HF Trending Robotics"
limit = 15
max_age_days = 30
exclude_regex = "(?i)gguf|awq|gptq|mlx|exl2|quant|lora"

[alphaxiv_topics]
# Most-viewed recent arXiv papers per category, fed to the curator as candidates for under-covered fields.
enabled = true
categories = ["cs.RO"]
interval = "7 Days"
limit = 10

[hf_papers]
enabled = true
limit = 25

[github_trending]
enabled = true
limit = 25

