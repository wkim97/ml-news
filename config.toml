[hackernews]
enabled = true
min_points = 100

[hf_models]
enabled = true
limit = 40
max_age_days = 14
# skip re-uploads / quantizations
exclude_regex = "(?i)gguf|awq|gptq|mlx|exl2|fp8|int4|int8|bnb|quant|uncensored|abliterated|lora"

[hf_papers]
enabled = true
limit = 25

[github_trending]
enabled = true
limit = 25
